{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login — Testify</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232143d6'/%3E%3Ctext x='32' y='46' font-family='Arial,Helvetica,sans-serif' font-size='40' font-weight='800' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}" />
  <style>
    .ec-messages { display: grid; gap: 10px; margin-bottom: var(--space-4); }
    .ec-alert { padding: 12px 16px; border-radius: 12px; border: 1px solid; font-size: .92rem; font-weight: 500; line-height: 1.4; }
    .ec-alert--success { background: #e6f7ec; border-color: #b7e4c7; color: #12793a; }
    .ec-alert--error   { background: #fdeaea; border-color: #f5c2c0; color: #b42318; }
    .ec-alert--warning { background: #fff4dc; border-color: #f3d9a0; color: #8a5100; }
    .ec-alert--info    { background: #eaf0ff; border-color: #c7d4fb; color: #1f3fb8; }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="card">
        <div class="auth-head">
          <div class="brand" style="justify-content:center;margin-bottom:var(--space-4);">
            <span class="brand-mark">T</span><span>Testify</span>
          </div>
          <h1>Student Login</h1>
          <p>{{ class_obj.class_name }}</p>
        </div>

        {% if messages %}
        <div class="ec-messages">
          {% for message in messages %}
          <div class="ec-alert ec-alert--{{ message.tags }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}

        {% if error %}
        <div class="ec-alert ec-alert--error" role="alert" style="margin-bottom:var(--space-4);">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label" for="s-enroll">Enrollment number<span class="req">*</span></label>
            <input type="text" id="s-enroll" name="enrollment_no" class="form-control" value="{{ enrollment_no|default:'' }}" required autofocus />
          </div>
          <div class="form-group">
            <label class="form-label" for="s-pw">Password<span class="req">*</span></label>
            <input type="password" id="s-pw" name="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
