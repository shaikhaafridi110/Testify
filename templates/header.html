{% load static %}
<header class="site-header">
  <div class="container header-inner">
    <a href="{% url 'index' %}" class="brand"><span class="brand-mark">T</span><span>Testify</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="{% url 'index' %}" class="nav-link{% if request.resolver_match.url_name == 'index' %} active{% endif %}" data-nav>Home</a>
      <a href="#" class="nav-link" data-nav>About</a>
      <a href="#" class="nav-link" data-nav>Features</a>
      <a href="#" class="nav-link" data-nav>How It Works</a>
      <a href="#" class="nav-link" data-nav>Exams</a>
      <a href="#" class="nav-link" data-nav>Leaderboard</a>
      <a href="#" class="nav-link" data-nav>Contact</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      {% if request.user.is_authenticated %}
        {% if request.user.role == 'admin' %}
          <a href="{% url 'admin_dashboard' %}" class="btn btn-primary">Dashboard</a>
        {% else %}
          <a href="{% url 'index' %}" class="btn btn-primary">Dashboard</a>
        {% endif %}
        <a href="{% url 'logout' %}" class="btn btn-ghost">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-ghost">Sign in</a>
        <a href="#" class="btn btn-primary">Get Started</a>
      {% endif %}
      <button class="theme-toggle menu-btn" aria-label="Open menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </div>
</header>
